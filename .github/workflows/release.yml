name: immutable release evidence

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build, test, and publish immutable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unsupported release tag: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          tag_object=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          tag_type=$(git cat-file -t "$tag_object")
          tag_target=$(git rev-parse "${GITHUB_REF_NAME}^{}")
          printf 'release_tag=%s\ntag_object=%s\ntag_type=%s\ntag_target=%s\ngithub_sha=%s\n' \
            "${GITHUB_REF_NAME}" "$tag_object" "$tag_type" "$tag_target" "$GITHUB_SHA"
          test "$tag_type" = "tag"
          test "$tag_target" = "${GITHUB_SHA}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace immutable release"
            exit 1
          fi
          build_started=$(date +%s%3N)
          go build ./...
          build_ms=$(( $(date +%s%3N) - build_started ))
          test_started=$(date +%s%3N)
          go test ./...
          test_ms=$(( $(date +%s%3N) - test_started ))
          go vet ./...
          test -z "$(gofmt -d $(git ls-files '*.go'))"
          evidence_dir="${RUNNER_TEMP}/gooo-causal-test-selector-release-evidence"
          mkdir -p "$evidence_dir/conformance"
          ./scripts/conformance.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/examples/causal-test-selector/main.gooo" \
            "$GITHUB_WORKSPACE/contracts/causal-test-selector-denominator-v1.json" \
            "$evidence_dir/conformance" \
            "release:${GITHUB_SHA}"
          printf 'release_tag=%s\ntarget_commit=%s\nannotated_tag_object=%s\nbuild_ms=%s\ntest_ms=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
            "$(git rev-parse "${GITHUB_REF_NAME}^{tag}")" "$build_ms" "$test_ms" \
            > "$evidence_dir/release-metadata.txt"
          tar -C "$evidence_dir" -czf "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" > "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Immutable causal test selection evidence for ${GITHUB_SHA}." \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          test "$(gh release view "${GITHUB_REF_NAME}" --json isImmutable --jq '.isImmutable')" = "true"
